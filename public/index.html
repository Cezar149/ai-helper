<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c4dff">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/avatar.png">
  <title>Айрис</title>
  <style>
    /* ===== Цвета. Меняйте здесь, чтобы поменять весь вид ===== */
    :root {
      --bg1: #f3ecff;
      --bg2: #e3efff;
      --surface: #ffffff;
      --text: #1f1b2e;
      --muted: #6b6685;
      --bot-bg: #ffffff;
      --border: #e3dcf5;
      --accent1: #7c4dff;
      --accent2: #b066ff;
      --error: #c01c28;
      --shadow: 0 4px 18px rgba(80, 50, 160, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #14101f;
        --bg2: #1a1736;
        --surface: #221c3a;
        --text: #eee9ff;
        --muted: #a59fc4;
        --bot-bg: #2a2347;
        --border: #3a3260;
        --error: #ff7b86;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    }

    button { font-family: inherit; cursor: pointer; }

    /* ===== Экран входа ===== */
    #login {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .avatar {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      overflow: hidden;
      position: relative;
    }
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card h1 { margin: 0 0 6px; font-size: 22px; }
    .card p { margin: 0 0 18px; color: var(--muted); }
    #loginForm { display: flex; flex-direction: column; gap: 10px; }
    #loginError { color: var(--error); margin-top: 12px; min-height: 1.2em; font-size: 14px; }

    input[type="text"], input[type="password"], #text {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent1); }

    .primary {
      padding: 12px 18px;
      font-size: 16px;
      color: #fff;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
    }
    .primary:disabled { opacity: 0.5; cursor: default; }

    /* ===== Экран чата ===== */
    #app {
      max-width: 720px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header .avatar { margin: 0; width: 44px; height: 44px; font-size: 20px; flex-shrink: 0; }

    /* Кнопка с текущей личностью: по нажатию открывается выбор */
    .persona-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: none;
      border: none;
    }
    .title { flex: 1; min-width: 0; }
    .title strong { display: block; font-size: 17px; }
    .caret { color: var(--muted); font-size: 13px; }
    #status {
      display: block;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.busy { color: var(--accent1); }
    .small {
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .small:hover { color: var(--text); }
    .small.on {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: pop 0.2s ease-out;
    }
    .msg img {
      display: block;
      max-width: 100%;
      max-height: 340px;
      border-radius: 12px;
      margin-bottom: 6px;
    }
    .msg audio {
      display: block;
      width: 250px;
      max-width: 100%;
      margin-bottom: 6px;
    }
    .msg img:last-child, .msg audio:last-child { margin-bottom: 0; }
    .msg.user {
      align-self: flex-end;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-bottom-right-radius: 6px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Индикатор «печатает» */
    .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent1);
      opacity: 0.4;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-6px); opacity: 1; }
    }

    /* Превью вложения (фото или аудио) */
    #preview {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #preview img { height: 56px; border-radius: 10px; }
    #preview audio { height: 36px; width: 200px; max-width: 45%; }
    #previewLabel { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }

    #form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #text { border-radius: 22px; min-width: 0; }
    .round {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      padding: 0;
      font-size: 18px;
      border-radius: 50%;
    }
    .ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
    }
    #mic.recording {
      color: #fff;
      background: #d92d20;
      border-color: transparent;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 45, 32, 0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(217, 45, 32, 0); }
    }

    /* ===== Выбор личности ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(10, 6, 25, 0.55);
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 80dvh;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-radius: 22px 22px 0 0;
    }
    @media (min-width: 600px) {
      .overlay { align-items: center; }
      .sheet { border-radius: 22px; }
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .p-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      text-align: left;
      color: var(--text);
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .p-item.active { border-color: var(--accent1); }
    .p-item .avatar { margin: 0; width: 44px; height: 44px; font-size: 20px; flex-shrink: 0; }
    .p-info { flex: 1; min-width: 0; }
    .p-info strong { display: block; }
    .p-info .t { display: block; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login" hidden>
    <div class="card">
      <div class="avatar">А<img src="/avatar.png" alt="" onerror="this.remove()"></div>
      <h1>Привет! Я Айрис.</h1>
      <p>Скажи, кто ты и какая у нас кодовая фраза.</p>
      <p style="font-size: 13px;">Я запоминаю важное из наших разговоров. Память хранится в твоём браузере и только твоя. Посмотреть: /память, стереть: /забудь всё.</p>
      <form id="loginForm">
        <input id="name" type="text" placeholder="Твоё имя" autocomplete="username">
        <input id="phrase" type="password" placeholder="Кодовая фраза" autocomplete="current-password">
        <button class="primary">Войти</button>
      </form>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- Экран чата -->
  <div id="app" hidden>
    <header>
      <button id="personaBtn" class="persona-btn" type="button" aria-label="Выбрать, с кем говорить">
        <span class="avatar" id="headerAvatar">А</span>
        <span class="title">
          <strong><span id="personaName">Айрис</span> <span class="caret" id="caret" hidden>▾</span></strong>
          <span id="status"></span>
        </span>
      </button>
      <button id="swear" class="small" type="button">Мат: выкл</button>
      <button id="clear" class="small" type="button">Очистить</button>
      <button id="logout" class="small" type="button">Выйти</button>
    </header>

    <div id="log"></div>

    <div id="preview" hidden>
      <img id="previewImg" alt="Прикреплённое фото" hidden>
      <audio id="previewAudio" controls hidden></audio>
      <span id="previewLabel"></span>
      <button id="removeMedia" class="small" type="button">Убрать</button>
    </div>

    <form id="form">
      <button id="attach" class="round ghost" type="button" aria-label="Прикрепить фото или аудио">📎</button>
      <button id="mic" class="round ghost" type="button" aria-label="Записать голосовое">🎤</button>
      <input id="file" type="file" accept="image/*,audio/*,.mp3,.m4a,.wav,.ogg,.oga,.flac,.aac,.opus,.webm" hidden>
      <input id="text" type="text" placeholder="Напишите сообщение..." autocomplete="off">
      <button id="send" class="primary round" aria-label="Отправить">➤</button>
    </form>
  </div>

  <!-- Выбор личности -->
  <div id="picker" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <strong>С кем поговорим?</strong>
        <button id="pickerClose" class="small" type="button">Закрыть</button>
      </div>
      <div id="pickerList"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "auth-token";
    const NAME_KEY = "auth-name";
    const MAX_MESSAGES = 100;
    const MAX_PHOTO_SIDE = 1280; // фото уменьшается до этого размера
    const MAX_AUDIO_SECONDS = 300; // аудио длиннее 5 минут обрезается
    const AUDIO_RATE = 16000; // частота звука, который уходит в Gemini

    const loginBox = document.getElementById("login");
    const appBox = document.getElementById("app");
    const loginForm = document.getElementById("loginForm");
    const nameInput = document.getElementById("name");
    const phraseInput = document.getElementById("phrase");
    const loginError = document.getElementById("loginError");
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");
    const logoutBtn = document.getElementById("logout");
    const swearBtn = document.getElementById("swear");
    const attachBtn = document.getElementById("attach");
    const micBtn = document.getElementById("mic");
    const fileInput = document.getElementById("file");
    const previewBox = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const previewAudio = document.getElementById("previewAudio");
    const previewLabel = document.getElementById("previewLabel");
    const removeMediaBtn = document.getElementById("removeMedia");
    const personaBtn = document.getElementById("personaBtn");
    const headerAvatar = document.getElementById("headerAvatar");
    const personaNameEl = document.getElementById("personaName");
    const caretEl = document.getElementById("caret");
    const picker = document.getElementById("picker");
    const pickerList = document.getElementById("pickerList");
    const pickerClose = document.getElementById("pickerClose");

    // Запасная личность, если список с сервера не пришёл
    const FALLBACK_PERSONA = { id: "iris", name: "Айрис", tagline: "ИИ-помощница", avatar: "/avatar.png" };

    let token = null;
    let userName = null;
    let chatHistory = [];
    let waiting = false;
    let typingEl = null;
    let pendingMedia = null; // вложение к следующему сообщению: фото или аудио
    let swearOn = false;
    let memory = []; // долгая память об этом человеке (хранится в этом браузере, общая для всех личностей)
    let personas = [FALLBACK_PERSONA];
    let defaultPersonaId = FALLBACK_PERSONA.id;
    let personaId = FALLBACK_PERSONA.id;

    try {
      token = localStorage.getItem(TOKEN_KEY);
      userName = localStorage.getItem(NAME_KEY);
    } catch (err) {}

    const currentPersona = () => personas.find((p) => p.id === personaId) || personas[0];

    // --- Сохранение переписки (у каждого человека и у каждой личности своя, только текст) ---

    // У главной личности ключ остаётся прежним, поэтому старая переписка не пропадает
    function storageKey() {
      return "chat-history:" + userName + (personaId === defaultPersonaId ? "" : ":" + personaId);
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(storageKey());
        return saved ? JSON.parse(saved) : [];
      } catch (err) {
        return [];
      }
    }

    function saveHistory() {
      if (chatHistory.length > MAX_MESSAGES) {
        chatHistory.splice(0, chatHistory.length - MAX_MESSAGES);
      }
      while (chatHistory.length > 0 && chatHistory[0].role !== "user") {
        chatHistory.shift();
      }
      try {
        localStorage.setItem(storageKey(), JSON.stringify(chatHistory));
      } catch (err) {}
    }

    // --- Сообщения и индикатор ожидания ---

    function removeTyping() {
      if (typingEl) {
        typingEl.remove();
        typingEl = null;
      }
    }

    // media: { kind: "image" | "audio", preview: адрес для показа } или адрес картинки строкой
    function addMessage(cls, text, media) {
      removeTyping(); // точки всегда исчезают перед новым сообщением
      const div = document.createElement("div");
      div.className = "msg " + cls;

      if (media) {
        const src = typeof media === "string" ? media : media.preview;
        const kind = typeof media === "string" ? "image" : media.kind;
        if (kind === "audio") {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = src;
          div.appendChild(audio);
        } else {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "изображение";
          div.appendChild(img);
        }
      }

      if (text) {
        const span = document.createElement("span");
        span.textContent = text;
        div.appendChild(span);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function setStatusIdle() {
      statusEl.classList.remove("busy");
      statusEl.textContent = currentPersona().tagline + " · " + userName;
    }

    function setBusyStatus(text) {
      statusEl.classList.add("busy");
      statusEl.textContent = text;
    }

    function setWaiting(on) {
      waiting = on;
      sendBtn.disabled = on;
      if (on) {
        setBusyStatus("печатает…");
        typingEl = document.createElement("div");
        typingEl.className = "msg bot typing";
        typingEl.innerHTML = "<span></span><span></span><span></span>";
        log.appendChild(typingEl);
        log.scrollTop = log.scrollHeight;
      } else {
        removeTyping();
        setStatusIdle();
      }
    }

    // --- Личности ---

    // Показывает аватарку или, если картинки нет, первую букву имени
    function setAvatar(el, p) {
      el.textContent = (p.name || "?").charAt(0).toUpperCase();
      if (p.avatar) {
        const img = document.createElement("img");
        img.src = p.avatar;
        img.alt = "";
        img.onerror = () => img.remove();
        el.appendChild(img);
      }
    }

    function renderPersonaHeader() {
      const p = currentPersona();
      setAvatar(headerAvatar, p);
      personaNameEl.textContent = p.name;
      caretEl.hidden = personas.length < 2;
      setStatusIdle();
    }

    function loadChatForPersona() {
      log.innerHTML = "";
      chatHistory = loadHistory();
      for (const m of chatHistory) {
        addMessage(m.role === "user" ? "user" : "bot", m.content);
      }
    }

    // Запрашивает у сервера список личностей, доступных этому человеку
    async function loadPersonas() {
      personas = [FALLBACK_PERSONA];
      defaultPersonaId = FALLBACK_PERSONA.id;

      try {
        const res = await fetch("/personas", { headers: { Authorization: "Bearer " + token } });
        if (res.status === 401) {
          forgetLogin();
          loginError.textContent = "Сессия закончилась, войдите снова.";
          showLogin();
          return;
        }
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.personas) && data.personas.length) {
            personas = data.personas;
            defaultPersonaId = data.defaultId || data.personas[0].id;
          }
        }
      } catch (err) {}

      // Какую личность человек выбирал в прошлый раз
      let saved = null;
      try { saved = localStorage.getItem("persona:" + userName); } catch (err) {}
      if (personas.some((p) => p.id === saved)) personaId = saved;
      else if (personas.some((p) => p.id === defaultPersonaId)) personaId = defaultPersonaId;
      else personaId = personas[0].id;
    }

    function openPicker() {
      if (personas.length < 2) return;
      pickerList.innerHTML = "";
      for (const p of personas) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "p-item" + (p.id === personaId ? " active" : "");

        const av = document.createElement("span");
        av.className = "avatar";
        setAvatar(av, p);

        const info = document.createElement("span");
        info.className = "p-info";
        const title = document.createElement("strong");
        title.textContent = p.name;
        const sub = document.createElement("span");
        sub.className = "t";
        sub.textContent = p.tagline;
        info.append(title, sub);

        btn.append(av, info);
        btn.addEventListener("click", () => selectPersona(p.id));
        pickerList.appendChild(btn);
      }
      picker.hidden = false;
    }

    function closePicker() {
      picker.hidden = true;
    }

    function selectPersona(id) {
      closePicker();
      if (id === personaId || waiting || recorder) return;
      personaId = id;
      try { localStorage.setItem("persona:" + userName, id); } catch (err) {}
      clearPending(true);
      renderPersonaHeader();
      loadChatForPersona();
    }

    personaBtn.addEventListener("click", openPicker);
    pickerClose.addEventListener("click", closePicker);
    picker.addEventListener("click", (e) => {
      if (e.target === picker) closePicker(); // нажатие мимо окна закрывает его
    });

    // --- Вложения: подготовка фото ---

    // Уменьшаем фото и превращаем в JPEG, чтобы оно было лёгким
    function fileToResizedImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          resolve({ mimeType: "image/jpeg", data: dataUrl.split(",")[1], preview: dataUrl });
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("bad image"));
        };
        img.src = url;
      });
    }

    // --- Вложения: подготовка аудио (любой формат -> WAV 16 кГц моно) ---

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(new Error("read failed"));
        reader.readAsDataURL(blob);
      });
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // моно
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }

    // Принимает файл или запись, возвращает { data (base64 WAV), url, seconds, trimmed }
    async function audioBlobToWav(blob) {
      const arrayBuffer = await blob.arrayBuffer();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      let decoded;
      try {
        decoded = await ctx.decodeAudioData(arrayBuffer);
      } finally {
        ctx.close();
      }

      const trimmed = decoded.duration > MAX_AUDIO_SECONDS;
      const seconds = Math.min(decoded.duration, MAX_AUDIO_SECONDS);

      // Пересчитываем в 16 кГц моно и обрезаем до лимита
      const offline = new OfflineAudioContext(1, Math.ceil(seconds * AUDIO_RATE), AUDIO_RATE);
      const source = offline.createBufferSource();
      source.buffer = decoded;
      source.connect(offline.destination);
      source.start(0);
      const rendered = await offline.startRendering();

      const wavBuffer = encodeWav(rendered.getChannelData(0), AUDIO_RATE);
      const wavBlob = new Blob([wavBuffer], { type: "audio/wav" });
      return {
        data: await blobToBase64(wavBlob),
        url: URL.createObjectURL(wavBlob),
        seconds,
        trimmed,
      };
    }

    const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

    // --- Вложение к следующему сообщению ---

    function showPreview(media) {
      previewImg.hidden = media.kind !== "image";
      previewAudio.hidden = media.kind !== "audio";
      if (media.kind === "image") {
        previewImg.src = media.preview;
        previewAudio.removeAttribute("src");
      } else {
        previewAudio.src = media.preview;
        previewImg.removeAttribute("src");
      }
      previewLabel.textContent = media.label;
      previewBox.hidden = false;
    }

    function hidePreview() {
      previewBox.hidden = true;
      previewImg.removeAttribute("src");
      previewAudio.pause();
      previewAudio.removeAttribute("src");
    }

    // Убрать вложение. Если оно не ушло в чат, освобождаем память
    function clearPending(release) {
      if (pendingMedia && release && pendingMedia.kind === "audio") {
        URL.revokeObjectURL(pendingMedia.preview);
      }
      pendingMedia = null;
      hidePreview();
    }

    function setPending(media) {
      clearPending(true);
      pendingMedia = media;
      showPreview(media);
    }

    function audioLabel(name, wav) {
      let label = "Аудио: " + name + " (" + mmss(wav.seconds) + ")";
      if (wav.trimmed) label += ". Файл длиннее 5 минут: возьму первые 5";
      return label;
    }

    attachBtn.addEventListener("click", () => {
      if (!recorder) fileInput.click();
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (!file) return;

      const isImage = file.type.startsWith("image/");
      const isAudio =
        file.type.startsWith("audio/") || /\.(mp3|m4a|wav|ogg|oga|flac|aac|opus|webm)$/i.test(file.name);

      try {
        if (isImage) {
          const img = await fileToResizedImage(file);
          setPending({
            kind: "image",
            mimeType: img.mimeType,
            data: img.data,
            preview: img.preview,
            label: "Фото прикреплено",
            source: "file",
          });
        } else if (isAudio) {
          setBusyStatus("обрабатываю аудио…");
          const wav = await audioBlobToWav(file);
          setPending({
            kind: "audio",
            mimeType: "audio/wav",
            data: wav.data,
            preview: wav.url,
            label: audioLabel(file.name, wav),
            source: "file",
          });
        } else {
          alert("Можно прикреплять фото и аудиофайлы (mp3, m4a, wav, ogg, flac).");
        }
      } catch (err) {
        console.error(err);
        alert("Не удалось открыть этот файл. Попробуй другой формат (mp3, m4a, wav, ogg или flac).");
      } finally {
        setStatusIdle();
      }
    });

    removeMediaBtn.addEventListener("click", () => clearPending(true));

    // --- Запись голосового сообщения ---

    let recorder = null;
    let recStream = null;
    let recChunks = [];
    let recTimer = null;
    let recStart = 0;

    function updateRecStatus() {
      setBusyStatus("● запись " + mmss((Date.now() - recStart) / 1000));
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
        alert("Этот браузер не поддерживает запись голоса.");
        return;
      }
      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert("Нет доступа к микрофону. Разреши его в настройках браузера для этого сайта.");
        return;
      }

      recChunks = [];
      recorder = new MediaRecorder(recStream);
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recChunks.push(e.data);
      };
      recorder.onstop = onRecordingStopped;
      recorder.start();

      recStart = Date.now();
      micBtn.classList.add("recording");
      micBtn.textContent = "■";
      updateRecStatus();
      recTimer = setInterval(() => {
        updateRecStatus();
        if ((Date.now() - recStart) / 1000 >= MAX_AUDIO_SECONDS) stopRecording();
      }, 500);
    }

    function stopRecording() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
    }

    async function onRecordingStopped() {
      clearInterval(recTimer);
      if (recStream) recStream.getTracks().forEach((t) => t.stop());
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";

      const blob = new Blob(recChunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
      recorder = null;
      recStream = null;

      if (blob.size < 1000) {
        setStatusIdle();
        return;
      }

      try {
        setBusyStatus("обрабатываю запись…");
        const wav = await audioBlobToWav(blob);
        setPending({
          kind: "audio",
          mimeType: "audio/wav",
          data: wav.data,
          preview: wav.url,
          label: "Голосовое сообщение (" + mmss(wav.seconds) + ")",
          source: "voice",
        });
      } catch (err) {
        console.error(err);
        alert("Не получилось обработать запись. Попробуй ещё раз.");
      } finally {
        setStatusIdle();
      }
    }

    micBtn.addEventListener("click", () => {
      if (recorder) stopRecording();
      else startRecording();
    });

    // --- Экраны ---

    function showLogin() {
      appBox.hidden = true;
      loginBox.hidden = false;
      phraseInput.value = "";
    }

    async function showApp() {
      loginBox.hidden = true;
      appBox.hidden = false;
      clearPending(true);
      swearOn = loadSwear();
      memory = loadMemory();
      updateSwearButton();

      await loadPersonas(); // при устаревшем пропуске вернёт на экран входа
      if (!token) return;

      renderPersonaHeader();
      loadChatForPersona();
    }

    function forgetLogin() {
      token = null;
      userName = null;
      try {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(NAME_KEY);
      } catch (err) {}
    }

    // --- Вход ---

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value, phrase: phraseInput.value }),
        });
        const data = await res.json();
        if (!res.ok) {
          loginError.textContent = data.error;
          return;
        }
        token = data.token;
        userName = data.name;
        try {
          localStorage.setItem(TOKEN_KEY, token);
          localStorage.setItem(NAME_KEY, userName);
        } catch (err) {}
        showApp();
      } catch (err) {
        loginError.textContent = "Нет связи с сервером.";
      }
    });

    logoutBtn.addEventListener("click", () => {
      stopRecording();
      closePicker();
      forgetLogin();
      showLogin();
    });

    // --- Отправка сообщения ---

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (waiting || recorder) return; // пока идёт запись, сначала остановите её

      const typed = input.value.trim();
      const media = pendingMedia;
      if (!typed && !media) return;

      // Текст для модели: свой или стандартный, если человек прислал только вложение
      let text = typed;
      if (!text && media) {
        if (media.kind === "image") text = "Посмотри на это фото.";
        else if (media.source === "voice") text = "Это моё голосовое сообщение. Ответь на него.";
        else text = "Послушай это аудио.";
      }
      const marker = media
        ? media.kind === "image"
          ? "[фото] "
          : media.source === "voice"
          ? "[голосовое] "
          : "[аудио] "
        : "";

      input.value = "";
      pendingMedia = null;
      hidePreview(); // адрес вложения остаётся в чате, поэтому не освобождаем его

      addMessage("user", typed, media);
      chatHistory.push({ role: "user", content: marker + text });
      setWaiting(true);

      try {
        // В историю вложения не сохраняются: они уходят только с текущим сообщением
        const messages = chatHistory.map((m) => ({ role: m.role, content: m.content }));
        if (media) {
          const last = messages[messages.length - 1];
          const payload = { mimeType: media.mimeType, data: media.data };
          if (media.kind === "image") last.image = payload;
          else last.audio = payload;
        }

        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify({
            messages,
            personaId,
            swearing: swearOn,
            memory,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          }),
        });
        const data = await res.json();

        // Сервер прислал обновлённую память (что-то запомнили или забыли)
        if (Array.isArray(data.memory)) {
          memory = data.memory;
          saveMemory();
        }

        if (res.status === 401) {
          // Пропуск устарел (например, сервер перезапускался)
          chatHistory.pop();
          saveHistory();
          forgetLogin();
          loginError.textContent = "Сессия закончилась, войдите снова.";
          showLogin();
          return;
        }

        if (!res.ok) {
          addMessage("bot", data.reply);
          chatHistory.pop();
          saveHistory();
          return;
        }

        const imageSrc = data.image
          ? "data:" + data.image.mimeType + ";base64," + data.image.data
          : null;
        addMessage("bot", data.reply, imageSrc);
        chatHistory.push({ role: "assistant", content: data.reply });
        saveHistory();
      } catch (err) {
        addMessage("bot", "Нет связи с сервером. Возможно, вложение слишком большое.");
        chatHistory.pop();
        saveHistory();
      } finally {
        setWaiting(false);
        input.focus();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("Удалить переписку с " + currentPersona().name + "?")) return;
      chatHistory = [];
      log.innerHTML = "";
      try { localStorage.removeItem(storageKey()); } catch (err) {}
    });

    // --- Режим мата (включается кнопкой, у каждого человека свой) ---

    function loadSwear() {
      try {
        return localStorage.getItem("swear:" + userName) === "1";
      } catch (err) {
        return false;
      }
    }

    function updateSwearButton() {
      swearBtn.textContent = swearOn ? "Мат: вкл" : "Мат: выкл";
      swearBtn.classList.toggle("on", swearOn);
    }

    swearBtn.addEventListener("click", () => {
      if (!swearOn && !confirm("Включить мат? Личности будут ругаться по-дружески. Только для взрослых.")) return;
      swearOn = !swearOn;
      try { localStorage.setItem("swear:" + userName, swearOn ? "1" : "0"); } catch (err) {}
      updateSwearButton();
    });

    // --- Долгая память (в этом браузере, отдельно для каждого человека, общая для всех личностей) ---

    function loadMemory() {
      try {
        const saved = JSON.parse(localStorage.getItem("memory:" + userName) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (err) {
        return [];
      }
    }

    function saveMemory() {
      try {
        localStorage.setItem("memory:" + userName, JSON.stringify(memory));
      } catch (err) {}
    }

    // --- Запуск ---

    if (token && userName) showApp();
    else showLogin();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
