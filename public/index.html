<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c4dff">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/avatar.png">
  <title>Айрис</title>
  <style>
    /* ===== Цвета. Меняйте здесь, чтобы поменять весь вид ===== */
    :root {
      --bg1: #f3ecff;
      --bg2: #e3efff;
      --surface: #ffffff;
      --text: #1f1b2e;
      --muted: #6b6685;
      --bot-bg: #ffffff;
      --border: #e3dcf5;
      --accent1: #7c4dff;
      --accent2: #b066ff;
      --error: #c01c28;
      --shadow: 0 4px 18px rgba(80, 50, 160, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #14101f;
        --bg2: #1a1736;
        --surface: #221c3a;
        --text: #eee9ff;
        --muted: #a59fc4;
        --bot-bg: #2a2347;
        --border: #3a3260;
        --error: #ff7b86;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
    }

    button { font-family: inherit; cursor: pointer; }

    /* ===== Экран входа ===== */
    #login {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .avatar {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      overflow: hidden;
      position: relative;
    }
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card h1 { margin: 0 0 6px; font-size: 22px; }
    .card p { margin: 0 0 18px; color: var(--muted); }
    #loginForm { display: flex; flex-direction: column; gap: 10px; }
    #loginError { color: var(--error); margin-top: 12px; min-height: 1.2em; font-size: 14px; }

    input[type="text"], input[type="password"], #text {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent1); }

    .primary {
      padding: 12px 18px;
      font-size: 16px;
      color: #fff;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
    }
    .primary:disabled { opacity: 0.5; cursor: default; }

    /* ===== Экран чата ===== */
    #app {
      max-width: 720px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header .avatar { margin: 0; width: 44px; height: 44px; font-size: 20px; flex-shrink: 0; }

    /* Кнопка с текущей личностью: по нажатию открывается выбор */
    .persona-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: none;
      border: none;
    }
    .title { flex: 1; min-width: 0; }
    .title strong { display: block; font-size: 17px; }
    .caret { color: var(--muted); font-size: 13px; }
    #status {
      display: block;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.busy { color: var(--accent1); }
    .small {
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .small:hover { color: var(--text); }
    #menuBtn { font-size: 18px; line-height: 1; padding: 6px 12px; }

    /* Меню: мат, озвучка, очистка, выход */
    .menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 12px;
      z-index: 5;
      min-width: 220px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .menu button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      text-align: left;
      color: var(--text);
      background: none;
      border: none;
      border-radius: 10px;
    }
    .menu button:hover { background: var(--bg1); }
    .menu button.on { color: var(--accent1); font-weight: 600; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      animation: pop 0.2s ease-out;
    }
    .msg img {
      display: block;
      max-width: 100%;
      max-height: 340px;
      border-radius: 12px;
      margin-bottom: 6px;
    }
    .msg audio {
      display: block;
      width: 250px;
      max-width: 100%;
      margin-bottom: 6px;
    }
    .msg img:last-child, .msg audio:last-child { margin-bottom: 0; }
    .msg.user {
      align-self: flex-end;
      color: #fff;
      white-space: pre-wrap;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      border-bottom-right-radius: 6px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Оформление ответов (Markdown) */
    .md:empty { display: none; }
    .md p { margin: 0 0 8px; }
    .md > :last-child { margin-bottom: 0; }
    .md .md-h { font-weight: 700; }
    .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
    .md li { margin: 2px 0; }
    .md a { color: var(--accent1); }
    .md code {
      padding: 1px 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
      background: rgba(127, 127, 127, 0.18);
      border-radius: 6px;
    }
    .md pre {
      position: relative;
      margin: 0 0 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(127, 127, 127, 0.16);
      border-radius: 12px;
    }
    .md pre code { padding: 0; background: none; white-space: pre; }
    .copy {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .speak {
      display: block;
      margin: 6px 0 0 auto;
      padding: 0 4px;
      font-size: 14px;
      background: none;
      border: none;
      opacity: 0.55;
    }
    .speak:hover { opacity: 1; }

    /* Индикатор «печатает» */
    .typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent1);
      opacity: 0.4;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-6px); opacity: 1; }
    }

    /* Превью вложения (фото или аудио) */
    #preview {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #preview img { height: 56px; border-radius: 10px; }
    #preview audio { height: 36px; width: 200px; max-width: 45%; }
    #previewLabel { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }

    #form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #text { border-radius: 22px; min-width: 0; }
    .round {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      padding: 0;
      font-size: 18px;
      border-radius: 50%;
    }
    .ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
    }
    #mic.recording {
      color: #fff;
      background: #d92d20;
      border-color: transparent;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 45, 32, 0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(217, 45, 32, 0); }
    }

    /* ===== Выбор личности ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(10, 6, 25, 0.55);
    }
    .sheet {
      width: 100%;
      max-width: 480px;
      max-height: 80dvh;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-radius: 22px 22px 0 0;
    }
    @media (min-width: 600px) {
      .overlay { align-items: center; }
      .sheet { border-radius: 22px; }
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .p-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      text-align: left;
      color: var(--text);
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .p-item.active { border-color: var(--accent1); }
    .p-item .avatar { margin: 0; width: 44px; height: 44px; font-size: 20px; flex-shrink: 0; }
    .p-info { flex: 1; min-width: 0; }
    .p-info strong { display: block; }
    .p-info .t { display: block; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login" hidden>
    <div class="card">
      <div class="avatar">А<img src="/avatar.png" alt="" onerror="this.remove()"></div>
      <h1>Привет! Я Айрис.</h1>
      <p>Скажи, кто ты и какая у нас кодовая фраза.</p>
      <p style="font-size: 13px;">Я запоминаю важное из наших разговоров. Память хранится в твоём браузере и только твоя. Посмотреть: /память, стереть: /забудь всё.</p>
      <form id="loginForm">
        <input id="name" type="text" placeholder="Твоё имя" autocomplete="username">
        <input id="phrase" type="password" placeholder="Кодовая фраза" autocomplete="current-password">
        <button class="primary">Войти</button>
      </form>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- Экран чата -->
  <div id="app" hidden>
    <header>
      <button id="personaBtn" class="persona-btn" type="button" aria-label="Выбрать, с кем говорить">
        <span class="avatar" id="headerAvatar">А</span>
        <span class="title">
          <strong><span id="personaName">Айрис</span> <span class="caret" id="caret" hidden>▾</span></strong>
          <span id="status"></span>
        </span>
      </button>
      <button id="menuBtn" class="small" type="button" aria-label="Меню">⋯</button>

      <div id="menu" class="menu" hidden>
        <button id="swear" type="button">Мат: выкл</button>
        <button id="tts" type="button">Озвучка: выкл</button>
        <button id="clear" type="button">Очистить переписку</button>
        <button id="logout" type="button">Выйти</button>
      </div>
    </header>

    <div id="log"></div>

    <div id="preview" hidden>
      <img id="previewImg" alt="Прикреплённое фото" hidden>
      <audio id="previewAudio" controls hidden></audio>
      <span id="previewLabel"></span>
      <button id="removeMedia" class="small" type="button">Убрать</button>
    </div>

    <form id="form">
      <button id="attach" class="round ghost" type="button" aria-label="Прикрепить фото или аудио">📎</button>
      <button id="mic" class="round ghost" type="button" aria-label="Записать голосовое">🎤</button>
      <input id="file" type="file" accept="image/*,audio/*,.mp3,.m4a,.wav,.ogg,.oga,.flac,.aac,.opus,.webm" hidden>
      <input id="text" type="text" placeholder="Напишите сообщение..." autocomplete="off">
      <button id="send" class="primary round" aria-label="Отправить">➤</button>
    </form>
  </div>

  <!-- Выбор личности -->
  <div id="picker" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <strong>С кем поговорим?</strong>
        <button id="pickerClose" class="small" type="button">Закрыть</button>
      </div>
      <div id="pickerList"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "auth-token";
    const NAME_KEY = "auth-name";
    const MAX_MESSAGES = 100;
    const MAX_PHOTO_SIDE = 1280; // фото уменьшается до этого размера
    const MAX_AUDIO_SECONDS = 300; // аудио длиннее 5 минут обрезается
    const AUDIO_RATE = 16000; // частота звука, который уходит в Gemini

    const loginBox = document.getElementById("login");
    const appBox = document.getElementById("app");
    const loginForm = document.getElementById("loginForm");
    const nameInput = document.getElementById("name");
    const phraseInput = document.getElementById("phrase");
    const loginError = document.getElementById("loginError");
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("send");
    const menuBtn = document.getElementById("menuBtn");
    const menu = document.getElementById("menu");
    const clearBtn = document.getElementById("clear");
    const logoutBtn = document.getElementById("logout");
    const swearBtn = document.getElementById("swear");
    const ttsBtn = document.getElementById("tts");
    const attachBtn = document.getElementById("attach");
    const micBtn = document.getElementById("mic");
    const fileInput = document.getElementById("file");
    const previewBox = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const previewAudio = document.getElementById("previewAudio");
    const previewLabel = document.getElementById("previewLabel");
    const removeMediaBtn = document.getElementById("removeMedia");
    const personaBtn = document.getElementById("personaBtn");
    const headerAvatar = document.getElementById("headerAvatar");
    const personaNameEl = document.getElementById("personaName");
    const caretEl = document.getElementById("caret");
    const picker = document.getElementById("picker");
    const pickerList = document.getElementById("pickerList");
    const pickerClose = document.getElementById("pickerClose");

    // Запасная личность, если список с сервера не пришёл
    const FALLBACK_PERSONA = { id: "iris", name: "Айрис", tagline: "ИИ-помощница", avatar: "/avatar.png", gender: "f" };

    let token = null;
    let userName = null;
    let chatHistory = [];
    let waiting = false;
    let typingEl = null;
    let pendingMedia = null; // вложение к следующему сообщению: фото или аудио
    let swearOn = false;
    let ttsOn = false;
    let memory = []; // долгая память об этом человеке (в этом браузере, общая для всех личностей)
    let personas = [FALLBACK_PERSONA];
    let defaultPersonaId = FALLBACK_PERSONA.id;
    let personaId = FALLBACK_PERSONA.id;

    try {
      token = localStorage.getItem(TOKEN_KEY);
      userName = localStorage.getItem(NAME_KEY);
    } catch (err) {}

    const currentPersona = () => personas.find((p) => p.id === personaId) || personas[0];

    // --- Сохранение переписки (у каждого человека и у каждой личности своя, только текст) ---

    // У главной личности ключ остаётся прежним, поэтому старая переписка не пропадает
    function storageKey() {
      return "chat-history:" + userName + (personaId === defaultPersonaId ? "" : ":" + personaId);
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(storageKey());
        return saved ? JSON.parse(saved) : [];
      } catch (err) {
        return [];
      }
    }

    function saveHistory() {
      if (chatHistory.length > MAX_MESSAGES) {
        chatHistory.splice(0, chatHistory.length - MAX_MESSAGES);
      }
      while (chatHistory.length > 0 && chatHistory[0].role !== "user") {
        chatHistory.shift();
      }
      try {
        localStorage.setItem(storageKey(), JSON.stringify(chatHistory));
      } catch (err) {}
    }

    // --- Оформление ответов: небольшой безопасный разбор Markdown ---

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Принимает уже экранированный текст строки
    function inlineMd(escaped) {
      return escaped
        .split(/(`[^`\n]+`)/g)
        .map((part, i) => {
          if (i % 2 === 1) return "<code>" + part.slice(1, -1) + "</code>";
          return part
            .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*\w])\*(\S(?:[^*\n]*?\S)?)\*(?![*\w])/g, "$1<em>$2</em>")
            .replace(
              /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
              '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );
        })
        .join("");
    }

    const BULLET = /^\s*[-*•]\s+/;
    const NUMBERED = /^\s*\d+[.)]\s+/;

    function renderMarkdown(text) {
      const lines = String(text).replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        // Блок кода (если закрывающих кавычек ещё нет, это идущий поток: показываем как есть)
        if (/^```/.test(line)) {
          const code = [];
          i++;
          while (i < lines.length && !/^```\s*$/.test(lines[i])) {
            code.push(lines[i]);
            i++;
          }
          i++; // пропускаем закрывающую строку
          html += "<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>";
          continue;
        }

        // Заголовок показываем жирной строкой
        const h = line.match(/^#{1,6}\s+(.*)$/);
        if (h) {
          html += '<p class="md-h">' + inlineMd(escapeHtml(h[1])) + "</p>";
          i++;
          continue;
        }

        // Списки
        if (BULLET.test(line) || NUMBERED.test(line)) {
          const ordered = NUMBERED.test(line);
          const re = ordered ? NUMBERED : BULLET;
          html += ordered ? "<ol>" : "<ul>";
          while (i < lines.length && re.test(lines[i])) {
            html += "<li>" + inlineMd(escapeHtml(lines[i].replace(re, ""))) + "</li>";
            i++;
          }
          html += ordered ? "</ol>" : "</ul>";
          continue;
        }

        if (!line.trim()) {
          i++;
          continue;
        }

        // Абзац: подряд идущие обычные строки
        const para = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^```/.test(lines[i]) &&
          !/^#{1,6}\s/.test(lines[i]) &&
          !BULLET.test(lines[i]) &&
          !NUMBERED.test(lines[i])
        ) {
          para.push(lines[i]);
          i++;
        }
        html += "<p>" + para.map((l) => inlineMd(escapeHtml(l))).join("<br>") + "</p>";
      }
      return html;
    }

    function addCopyButtons(root) {
      root.querySelectorAll("pre").forEach((pre) => {
        const code = pre.querySelector("code");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy";
        btn.textContent = "Копировать";
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
            btn.textContent = "Скопировано";
          } catch (err) {
            btn.textContent = "Не вышло";
          }
          setTimeout(() => (btn.textContent = "Копировать"), 1500);
        });
        pre.appendChild(btn);
      });
    }

    // --- Озвучка (встроенный синтезатор речи браузера) ---

    const hasTTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
    let voices = [];
    if (hasTTS) {
      voices = speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
    }

    // Подсказки по названиям русских голосов (определить пол по-другому браузер не позволяет)
    const FEMALE_HINTS = /milena|irina|ирина|katya|катя|svetlana|светлана|tatyana|татьяна|alena|алёна|алена|yelena|елена|anna|анна|female|жен/i;
    const MALE_HINTS = /yuri|юрий|pavel|павел|dmitry|дмитрий|maxim|максим|ivan|иван|aleksandr|александр|(^|\s)male|муж/i;

    function pickVoice(lang, gender) {
      const list = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith(lang));
      if (!list.length) return { voice: null, matched: false };
      const isFemale = (v) => FEMALE_HINTS.test(v.name);
      const isMale = (v) => !isFemale(v) && MALE_HINTS.test(v.name);
      const wanted = list.find(gender === "m" ? isMale : isFemale);
      if (wanted) return { voice: wanted, matched: true };
      return { voice: list.find((v) => v.default) || list[0], matched: false };
    }

    // Убираем из текста то, что не стоит читать вслух
    function speechText(md) {
      return String(md)
        .replace(/```[\s\S]*?(```|$)/g, " Здесь блок кода. ")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, "$1")
        .replace(/https?:\/\/\S+/g, "ссылка")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/\*+/g, "")
        .replace(/^\s*[-•]\s+/gm, "")
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Режем длинный текст на куски, иначе некоторые браузеры замолкают на середине
    function chunkText(t, max) {
      const sentences = t.match(/[^.!?…]+[.!?…]*\s*/g) || [t];
      const chunks = [];
      let cur = "";
      for (const s of sentences) {
        if (cur && (cur + s).length > max) {
          chunks.push(cur);
          cur = "";
        }
        cur += s;
      }
      if (cur) chunks.push(cur);
      return chunks;
    }

    function stopSpeaking() {
      if (hasTTS) speechSynthesis.cancel();
    }

    // На iPhone озвучка должна начинаться после нажатия пользователем: «разблокируем» её при отправке
    function unlockSpeech() {
      if (!hasTTS) return;
      try {
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0;
        speechSynthesis.speak(u);
      } catch (err) {}
    }

    function speak(raw) {
      if (!hasTTS) return;
      stopSpeaking();
      const clean = speechText(raw);
      if (!clean) return;

      const lang = /[А-Яа-яЁё]/.test(clean) ? "ru" : "en";
      const p = currentPersona();
      const { voice, matched } = pickVoice(lang, p.gender);

      for (const part of chunkText(clean, 200)) {
        const u = new SpeechSynthesisUtterance(part);
        if (voice) {
          u.voice = voice;
          u.lang = voice.lang;
        } else {
          u.lang = lang === "ru" ? "ru-RU" : "en-US";
        }
        u.rate = (p.voice && p.voice.rate) || 1;
        u.pitch = (p.voice && p.voice.pitch) || (matched ? 1 : p.gender === "m" ? 0.8 : 1.1);
        speechSynthesis.speak(u);
      }
    }

    // media (для сообщений человека): { kind: "image" | "audio", preview: адрес }

    // --- Вложения: подготовка фото ---

    // Уменьшаем фото и превращаем в JPEG, чтобы оно было лёгким
    function fileToResizedImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, MAX_PHOTO_SIDE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          resolve({ mimeType: "image/jpeg", data: dataUrl.split(",")[1], preview: dataUrl });
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("bad image"));
        };
        img.src = url;
      });
    }

    // --- Вложения: подготовка аудио (любой формат -> WAV 16 кГц моно) ---

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(new Error("read failed"));
        reader.readAsDataURL(blob);
      });
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, 1, true); // моно
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }

    // Принимает файл или запись, возвращает { data (base64 WAV), url, seconds, trimmed }
    async function audioBlobToWav(blob) {
      const arrayBuffer = await blob.arrayBuffer();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      let decoded;
      try {
        decoded = await ctx.decodeAudioData(arrayBuffer);
      } finally {
        ctx.close();
      }

      const trimmed = decoded.duration > MAX_AUDIO_SECONDS;
      const seconds = Math.min(decoded.duration, MAX_AUDIO_SECONDS);

      // Пересчитываем в 16 кГц моно и обрезаем до лимита
      const offline = new OfflineAudioContext(1, Math.ceil(seconds * AUDIO_RATE), AUDIO_RATE);
      const source = offline.createBufferSource();
      source.buffer = decoded;
      source.connect(offline.destination);
      source.start(0);
      const rendered = await offline.startRendering();

      const wavBuffer = encodeWav(rendered.getChannelData(0), AUDIO_RATE);
      const wavBlob = new Blob([wavBuffer], { type: "audio/wav" });
      return {
        data: await blobToBase64(wavBlob),
        url: URL.createObjectURL(wavBlob),
        seconds,
        trimmed,
      };
    }

    const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

    // --- Вложение к следующему сообщению ---

    function showPreview(media) {
      previewImg.hidden = media.kind !== "image";
      previewAudio.hidden = media.kind !== "audio";
      if (media.kind === "image") {
        previewImg.src = media.preview;
        previewAudio.removeAttribute("src");
      } else {
        previewAudio.src = media.preview;
        previewImg.removeAttribute("src");
      }
      previewLabel.textContent = media.label;
      previewBox.hidden = false;
    }

    function hidePreview() {
      previewBox.hidden = true;
      previewImg.removeAttribute("src");
      previewAudio.pause();
      previewAudio.removeAttribute("src");
    }

    // Убрать вложение. Если оно не ушло в чат, освобождаем память
    function clearPending(release) {
      if (pendingMedia && release && pendingMedia.kind === "audio") {
        URL.revokeObjectURL(pendingMedia.preview);
      }
      pendingMedia = null;
      hidePreview();
    }

    function setPending(media) {
      clearPending(true);
      pendingMedia = media;
      showPreview(media);
    }

    function audioLabel(name, wav) {
      let label = "Аудио: " + name + " (" + mmss(wav.seconds) + ")";
      if (wav.trimmed) label += ". Файл длиннее 5 минут: возьму первые 5";
      return label;
    }

    // --- Запись голосового сообщения ---

    let recorder = null;
    let recStream = null;
    let recChunks = [];
    let recTimer = null;
    let recStart = 0;

    function updateRecStatus() {
      setBusyStatus("● запись " + mmss((Date.now() - recStart) / 1000));
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
        alert("Этот браузер не поддерживает запись голоса.");
        return;
      }
      stopSpeaking(); // чтобы озвучка не попала в запись
      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert("Нет доступа к микрофону. Разреши его в настройках браузера для этого сайта.");
        return;
      }

      recChunks = [];
      recorder = new MediaRecorder(recStream);
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recChunks.push(e.data);
      };
      recorder.onstop = onRecordingStopped;
      recorder.start();

      recStart = Date.now();
      micBtn.classList.add("recording");
      micBtn.textContent = "■";
      updateRecStatus();
      recTimer = setInterval(() => {
        updateRecStatus();
        if ((Date.now() - recStart) / 1000 >= MAX_AUDIO_SECONDS) stopRecording();
      }, 500);
    }

    function stopRecording() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
    }

    async function onRecordingStopped() {
      clearInterval(recTimer);
      if (recStream) recStream.getTracks().forEach((t) => t.stop());
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";

      const blob = new Blob(recChunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
      recorder = null;
      recStream = null;

      if (blob.size < 1000) {
        setStatusIdle();
        return;
      }

      try {
        setBusyStatus("обрабатываю запись…");
        const wav = await audioBlobToWav(blob);
        setPending({
          kind: "audio",
          mimeType: "audio/wav",
          data: wav.data,
          preview: wav.url,
          label: "Голосовое сообщение (" + mmss(wav.seconds) + ")",
          source: "voice",
        });
      } catch (err) {
        console.error(err);
        alert("Не получилось обработать запись. Попробуй ещё раз.");
      } finally {
        setStatusIdle();
      }
    }

    micBtn.addEventListener("click", () => {
      if (recorder) stopRecording();
      else startRecording();
    });

    // --- Экраны ---

    // --- Приём ответа потоком ---

    // Читает ответ сервера построчно: каждая строка это одно событие в формате JSON
    async function readStream(res, onEvent) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      const flushLine = (line) => {
        line = line.trim();
        if (!line) return;
        try {
          onEvent(JSON.parse(line));
        } catch (err) {
          console.error("Не удалось разобрать строку потока", err);
        }
      };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          flushLine(buf.slice(0, idx));
          buf = buf.slice(idx + 1);
        }
      }
      flushLine(buf);
    }

    async function handleStream(res) {
      let full = "";
      let msg = null; // { el, textEl }: сообщение личности, в которое льётся текст
      let image = null;
      let errorReply = null;
      let scheduled = false;

      function paint() {
        scheduled = false;
        if (!msg) return;
        const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        msg.textEl.innerHTML = renderMarkdown(full);
        if (nearBottom) log.scrollTop = log.scrollHeight;
      }

      function onEvent(ev) {
        if (ev.t === "text") {
          full += ev.d;
          if (!msg) {
            removeTyping(); // первое слово: точки уступают место тексту
            msg = createBotMessage();
          }
          if (!scheduled) {
            scheduled = true;
            requestAnimationFrame(paint);
          }
        } else if (ev.t === "status") {
          setBusyStatus(ev.d);
        } else if (ev.t === "done") {
          image = ev.image || null;
          if (Array.isArray(ev.memory)) {
            memory = ev.memory;
            saveMemory();
          }
        } else if (ev.t === "error") {
          errorReply = ev.reply || "Что-то пошло не так.";
        }
      }

      try {
        await readStream(res, onEvent);
      } catch (err) {
        console.error(err);
        errorReply = errorReply || "Связь прервалась.";
      }

      const hasText = full.trim().length > 0;

      // Ответ не получен совсем: показываем ошибку, а сообщение убираем из истории
      if (errorReply && !hasText && !image) {
        if (msg) msg.el.remove();
        addMessage("bot", errorReply);
        chatHistory.pop();
        saveHistory();
        return;
      }

      // Ответ оборвался на середине: оставляем то, что успело прийти
      if (errorReply) full += (hasText ? "\n\n" : "") + "(ответ оборвался: " + errorReply + ")";

      const imageSrc = image ? "data:" + image.mimeType + ";base64," + image.data : null;
      if (!msg) {
        removeTyping();
        msg = createBotMessage();
      }
      msg.textEl.innerHTML = renderMarkdown(full);
      finishBotMessage(msg.el, msg.textEl, full, imageSrc);

      chatHistory.push({ role: "assistant", content: full });
      saveHistory();

      if (ttsOn) speak(full);
    }

    // --- Отправка сообщения ---

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (waiting || recorder) return; // пока идёт запись, сначала остановите её

      const typed = input.value.trim();
      const media = pendingMedia;
      if (!typed && !media) return;

      // Текст для модели: свой или стандартный, если человек прислал только вложение
      let text = typed;
      if (!text && media) {
        if (media.kind === "image") text = "Посмотри на это фото.";
        else if (media.source === "voice") text = "Это моё голосовое сообщение. Ответь на него.";
        else text = "Послушай это аудио.";
      }
      const marker = media
        ? media.kind === "image"
          ? "[фото] "
          : media.source === "voice"
          ? "[голосовое] "
          : "[аудио] "
        : "";

      stopSpeaking();
      if (ttsOn) unlockSpeech();

      input.value = "";
      pendingMedia = null;
      hidePreview(); // адрес вложения остаётся в чате, поэтому не освобождаем его

      addMessage("user", typed, media);
      chatHistory.push({ role: "user", content: marker + text });
      setWaiting(true);

      try {
        // В историю вложения не сохраняются: они уходят только с текущим сообщением
        const messages = chatHistory.map((m) => ({ role: m.role, content: m.content }));
        if (media) {
          const last = messages[messages.length - 1];
          const payload = { mimeType: media.mimeType, data: media.data };
          if (media.kind === "image") last.image = payload;
          else last.audio = payload;
        }

        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify({
            messages,
            personaId,
            swearing: swearOn,
            memory,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          }),
        });

        // Обычные ответы идут потоком
        if ((res.headers.get("content-type") || "").includes("application/x-ndjson")) {
          await handleStream(res);
          return;
        }

        // Команды (/память и другие) и ошибки приходят обычным JSON
        const data = await res.json();

        if (Array.isArray(data.memory)) {
          memory = data.memory;
          saveMemory();
        }

        if (res.status === 401) {
          // Пропуск устарел (например, сервер перезапускался)
          chatHistory.pop();
          saveHistory();
          forgetLogin();
          loginError.textContent = "Сессия закончилась, войдите снова.";
          showLogin();
          return;
        }

        if (!res.ok) {
          addMessage("bot", data.reply);
          chatHistory.pop();
          saveHistory();
          return;
        }

        const imageSrc = data.image
          ? "data:" + data.image.mimeType + ";base64," + data.image.data
          : null;
        addMessage("bot", data.reply, imageSrc);
        chatHistory.push({ role: "assistant", content: data.reply });
        saveHistory();
      } catch (err) {
        console.error(err);
        addMessage("bot", "Нет связи с сервером. Возможно, вложение слишком большое.");
        chatHistory.pop();
        saveHistory();
      } finally {
        setWaiting(false);
        input.focus();
      }
    });

    clearBtn.addEventListener("click", () => {
      toggleMenu(false);
      if (!confirm("Удалить переписку с " + currentPersona().name + "?")) return;
      stopSpeaking();
      chatHistory = [];
      log.innerHTML = "";
      try { localStorage.removeItem(storageKey()); } catch (err) {}
    });

    // --- Режим мата (включается кнопкой, у каждого человека свой) ---

    function loadSwear() {
      try {
        return localStorage.getItem("swear:" + userName) === "1";
      } catch (err) {
        return false;
      }
    }

    function updateSwearButton() {
      swearBtn.textContent = swearOn ? "Мат: вкл" : "Мат: выкл";
      swearBtn.classList.toggle("on", swearOn);
    }

    swearBtn.addEventListener("click", () => {
      toggleMenu(false);
      if (!swearOn && !confirm("Включить мат? Личности будут ругаться по-дружески. Только для взрослых.")) return;
      swearOn = !swearOn;
      try { localStorage.setItem("swear:" + userName, swearOn ? "1" : "0"); } catch (err) {}
      updateSwearButton();
    });

    // --- Озвучка ответов (включается кнопкой, у каждого человека своя) ---

    function loadTts() {
      try {
        return hasTTS && localStorage.getItem("tts:" + userName) === "1";
      } catch (err) {
        return false;
      }
    }

    function updateTtsButton() {
      ttsBtn.hidden = !hasTTS;
      ttsBtn.textContent = ttsOn ? "Озвучка: вкл" : "Озвучка: выкл";
      ttsBtn.classList.toggle("on", ttsOn);
    }

    ttsBtn.addEventListener("click", () => {
      toggleMenu(false);
      ttsOn = !ttsOn;
      if (!ttsOn) stopSpeaking();
      try { localStorage.setItem("tts:" + userName, ttsOn ? "1" : "0"); } catch (err) {}
      updateTtsButton();
    });

    // --- Долгая память (в этом браузере, отдельно для каждого человека, общая для всех личностей) ---

    function loadMemory() {
      try {
        const saved = JSON.parse(localStorage.getItem("memory:" + userName) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch (err) {
        return [];
      }
    }

    function saveMemory() {
      try {
        localStorage.setItem("memory:" + userName, JSON.stringify(memory));
      } catch (err) {}
    }

    // --- Запуск ---

    if (token && userName) showApp();
    else showLogin();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
